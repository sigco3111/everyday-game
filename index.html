<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回声游戏厅 · 每天一个小游戏</title>
<style>
  :root { --bg: #0A0E17; --panel: #111726; --line: #232B3D; --line2: #2A3449; --text: #E8EEF7; --text2: #C3CDDF; --mute: #9AA7BD; --accent: #7FE3FF; --gold: #FFD66E; --ok: #6FE0A0; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; }
  a { color: var(--accent); } a:hover { color: #B8F0FF; }
  h1, h2, h3, p { margin: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

  header { border-bottom: 1px solid #1E2637; position: sticky; top: 0; z-index: 5; background: rgba(10, 14, 23, .92); backdrop-filter: blur(8px); }
  header .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 28px; padding-top: 12px; padding-bottom: 12px; }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); font-size: 20px; font-weight: 900; letter-spacing: 2px; }
  nav { display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 260px; }
  nav a { padding: 9px 14px; border-radius: 10px; text-decoration: none; color: var(--text2); font-size: 15px; }
  nav a:hover { background: var(--panel); color: var(--text); }
  nav a.on { background: var(--text); color: var(--bg); font-weight: 700; }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .search { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border: 1px solid var(--line2); border-radius: 12px; background: var(--panel); }
  .search input { width: 150px; background: transparent; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 14px; }
  .search:focus-within { border-color: var(--accent); }
  .streak { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 12px; background: #2A2110; color: var(--gold); font-weight: 700; font-size: 14px; }

  main { display: flex; flex-direction: column; gap: 56px; padding-top: 32px; padding-bottom: 72px; }
  section { scroll-margin-top: 90px; }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
  h2 { font-size: 24px; font-weight: 900; } h2 small { color: var(--mute); font-size: 16px; font-weight: 400; }
  .hint { color: var(--mute); font-size: 14px; }

  #today { display: flex; flex-wrap: wrap; gap: 28px; align-items: stretch; }
  .cover { flex: 999 1 520px; min-width: 0; position: relative; display: block; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); }
  .cover img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; transition: transform .4s; }
  .cover:hover img { transform: scale(1.03); }
  .pills { position: absolute; left: 16px; top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { padding: 6px 12px; border-radius: 999px; background: var(--bg); color: var(--text); font-size: 13px; }
  .pill.hot { background: var(--accent); color: #06222B; font-weight: 700; }
  .info { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 18px; justify-content: center; }
  .kicker { color: var(--accent); font-size: 14px; font-weight: 700; letter-spacing: 2px; margin-bottom: 4px; }
  h1 { font-size: clamp(40px, 6vw, 56px); line-height: 1.15; font-weight: 900; letter-spacing: 4px; }
  .intro { color: var(--text2); font-size: 17px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tags span { padding: 5px 12px; border-radius: 8px; border: 1px solid var(--line2); color: var(--text2); font-size: 13px; }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .play { display: inline-flex; align-items: center; gap: 10px; height: 56px; padding: 0 36px; border-radius: 14px; background: var(--gold); color: #1A1405; font-size: 20px; font-weight: 900; letter-spacing: 4px; text-decoration: none; transition: transform .12s, background .12s; }
  .play:hover { background: #FFE39A; color: #1A1405; transform: translateY(-2px); } .play:active { transform: none; }
  .rec { color: var(--mute); font-size: 14px; } .rec b { color: var(--gold); font-size: 18px; }

  .days { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
  .day { flex: 1 0 150px; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); text-decoration: none; color: var(--text); }
  a.day:hover { border-color: var(--mute); color: var(--text); }
  .day .when { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--mute); }
  .day img, .day .lock { width: 100%; height: 72px; border-radius: 8px; object-fit: cover; }
  .day b { font-size: 15px; }
  .day.now { background: #10202A; border: 2px solid var(--accent); padding: 11px; } .day.now .when { color: var(--accent); font-weight: 700; }
  .day.soon { background: none; border: 1px dashed var(--line2); color: var(--mute); } .day.soon b { font-weight: 400; font-size: 14px; }
  .lock { background: var(--panel); display: flex; align-items: center; justify-content: center; }

  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line2); background: transparent; color: var(--text2); font: inherit; font-size: 14px; cursor: pointer; }
  .chips button:hover { border-color: var(--mute); color: var(--text); }
  .chips button[aria-pressed="true"] { border-color: var(--text); background: var(--text); color: var(--bg); font-weight: 700; }
  .sort { display: flex; align-items: center; gap: 8px; color: var(--mute); font-size: 14px; }
  select { height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel); color: var(--text); font: inherit; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
  .card { display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); text-decoration: none; color: var(--text); transition: transform .15s, border-color .15s; }
  a.card:hover { transform: translateY(-4px); border-color: var(--mute); color: var(--text); }
  .card .pic { position: relative; } .card img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
  .card .badge { position: absolute; left: 10px; top: 10px; padding: 4px 10px; border-radius: 999px; background: var(--bg); color: var(--ok); font-size: 12px; font-weight: 700; }
  .card .badge.hot { background: var(--accent); color: #06222B; }
  .card .body { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 16px; flex: 1; }
  .card .t { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; } .card h3 { font-size: 19px; } .card .no { color: var(--mute); font-size: 13px; }
  .card .meta { color: var(--mute); font-size: 13px; }
  .card .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; padding-top: 4px; font-size: 13px; color: var(--text2); } .card .foot b { color: var(--gold); }
  .btn { display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 10px; background: var(--gold); color: #1A1405; font-weight: 700; font-size: 15px; }
  .btn.again { background: none; border: 1px solid var(--gold); color: var(--gold); }
  .card.soon { background: none; border: 1px dashed var(--line2); color: var(--mute); } .card.soon .lock { width: 100%; height: auto; aspect-ratio: 16 / 10; border-radius: 0; } .card.soon h3 { color: var(--text2); }
  .empty { grid-column: 1 / -1; padding: 40px 16px; text-align: center; color: var(--mute); border: 1px dashed var(--line2); border-radius: 16px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 12px; }
  .stat { padding: 20px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); }
  .stat p { color: var(--mute); font-size: 14px; } .stat .n { margin-top: 4px; font-size: 36px; font-weight: 900; line-height: 1.2; color: var(--text); } .stat .n small { font-size: 16px; font-weight: 400; color: var(--text2); }
  .stat .n.gold { color: var(--gold); } .stat .n.s { font-size: 20px; line-height: 1.8; font-weight: 700; }
  footer { border-top: 1px solid #1E2637; } footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding-top: 24px; padding-bottom: 24px; color: var(--mute); font-size: 13px; }
  @media (max-width: 640px) { .wrap { padding: 0 16px; } main { gap: 40px; padding-top: 20px; } .search { flex: 1; } .search input { width: 100%; } .tools { width: 100%; } .play { flex: 1; justify-content: center; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="./">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="4" fill="#7FE3FF"/><circle cx="15" cy="15" r="9" fill="none" stroke="#7FE3FF" stroke-width="2" opacity=".7"/><circle cx="15" cy="15" r="13.5" fill="none" stroke="#7FE3FF" stroke-width="1.5" opacity=".35"/></svg>
      回声游戏厅
    </a>
    <nav aria-label="主导航">
      <a href="#today" class="on">今日</a><a href="#games">全部游戏</a><a href="#week">上新日历</a><a href="#me">我的记录</a>
    </nav>
    <div class="tools">
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA7BD" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.500-3.500"/></svg>
        <span class="sr">搜索游戏</span>
        <input id="q" type="search" placeholder="塔防、射击、解压" autocomplete="off">
      </label>
      <div class="streak" id="streak"></div>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="today" aria-label="今日游戏"></section>

  <section id="week">
    <div class="head"><h2>上新日历</h2><p class="hint">每天一个小游戏，玩过当天的就算打卡</p></div>
    <div class="days" id="days"></div>
  </section>

  <section id="games">
    <div class="bar">
      <h2>全部游戏 <small id="count"></small></h2>
      <div class="sort"><label for="sort">排序</label><select id="sort"><option value="new">最新上线</option><option value="recent">最近玩过</option><option value="short">时间最短</option></select></div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="筛选" style="margin-bottom: 20px"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="me">
    <div class="head"><h2>我的记录</h2></div>
    <div class="stats" id="stats"></div>
    <p class="hint" style="font-size: 13px">记录保存在这台设备的浏览器里，不需要登录。</p>
  </section>
</main>

<footer><div class="wrap"><span>回声游戏厅 · 每天一个小游戏</span><span>电脑、平板、手机打开都能玩</span></div></footer>
<script type="module" src="hub.js"></script>
</body>
</html>
