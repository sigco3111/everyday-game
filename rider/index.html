<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>回声 · 骑手</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070c; overflow: hidden; touch-action: none;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: #f2f6fa; user-select: none; -webkit-user-select: none; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  canvas { display: block; }
  #hud, #screen { position: absolute; inset: 0; }
  #hud { display: none; pointer-events: none; text-shadow: 0 1px 3px rgba(0, 0, 0, .8); }
  .panel { background: rgba(10, 14, 22, .72); border: 1px solid rgba(255, 255, 255, .14); border-radius: 14px; backdrop-filter: blur(6px); }
  #topbar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px; padding: 8px 18px; font-size: 14px; white-space: nowrap; }
  #topbar b { font-size: 17px; font-variant-numeric: tabular-nums; } #money { color: #ffd66e; } #rating { color: #8be9ff; }
  #mini { position: absolute; left: 12px; top: 12px; width: 190px; height: 190px; padding: 6px; } #mini canvas { width: 100%; height: 100%; border-radius: 10px; }
  #speed { position: absolute; left: 16px; bottom: 16px; padding: 8px 16px; font-size: 13px; } #speed b { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; } #speed i { display: block; font-style: normal; font-size: 12px; opacity: .8; }
  #phone { position: absolute; right: 12px; top: 12px; width: min(300px, 78vw); padding: 10px; pointer-events: auto; text-shadow: none; }
  #phone h4 { margin: 0 0 6px; font-size: 13px; font-weight: 700; color: #ffd66e; display: flex; justify-content: space-between; } #phone h4 span { color: #9fb0c4; font-weight: 400; }
  .ord { margin-top: 6px; padding: 8px 10px; border-radius: 10px; background: rgba(255, 255, 255, .07); font-size: 13px; line-height: 1.55; border-left: 4px solid #8be9ff; }
  .ord.cur { background: rgba(139, 233, 255, .16); } .ord.late { border-left-color: #ff6a5a; } .ord.warn { border-left-color: #ffc21a; }
  .ord b { font-size: 14px; } .ord .t { float: right; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; } .ord small { color: #a9b8ca; }
  #offer { margin-top: 8px; padding: 10px; border-radius: 12px; background: #ffd66e; color: #2a1d02; display: none; }
  #offer b { font-size: 20px; } #offer .row { display: flex; gap: 8px; margin-top: 8px; }
  #offer button { flex: 1; height: 40px; border: 0; border-radius: 10px; font: inherit; font-weight: 800; font-size: 15px; cursor: pointer; } #oYes { background: #1f8f4e; color: #fff; } #oNo { background: rgba(0, 0, 0, .14); color: #2a1d02; }
  #offer .bar { height: 4px; border-radius: 2px; background: rgba(0, 0, 0, .15); margin-top: 8px; overflow: hidden; } #offer .bar i { display: block; height: 100%; background: #2a1d02; }
  #toasts { position: absolute; left: 50%; top: 132px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .toast { padding: 7px 16px; border-radius: 999px; background: rgba(10, 14, 22, .82); border: 1px solid rgba(255, 255, 255, .16); font-size: 14px; animation: tin .25s ease-out; white-space: nowrap; }
  .toast.good { border-color: #35c46a; color: #9ff0b8; } .toast.bad { border-color: #ff6a5a; color: #ffb4aa; } .toast.sys { border-color: #ffd66e; color: #ffe9a8; }
  @keyframes tin { from { opacity: 0; transform: translateY(-8px); } }
  #nav { position: absolute; top: 58px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 12px; padding: 8px 18px 8px 10px; white-space: nowrap; }
  #navA { width: 46px; height: 46px; border-radius: 50%; background: #ffd66e; display: flex; align-items: center; justify-content: center; }
  #navA svg { width: 28px; height: 28px; transition: transform .12s; } #nav b { font-size: 22px; font-weight: 900; } #nav small { display: block; font-size: 12px; color: #c9d6e6; }
  #nav.go #navA { background: #5aff9a; }
  #pin { position: absolute; left: 0; top: 0; display: none; transform: translate(-50%, -100%); padding: 5px 12px 6px; border-radius: 12px; background: #ffb02e; color: #241703; font-weight: 800; font-size: 14px; text-shadow: none; white-space: nowrap; box-shadow: 0 3px 10px rgba(0, 0, 0, .5); }
  #pin.go { background: #5aff9a; } #pin i { font-style: normal; font-weight: 400; margin-left: 6px; }
  #cta { position: absolute; left: 50%; top: 62%; transform: translateX(-50%); display: none; padding: 12px 22px; font-size: 18px; font-weight: 800; text-align: center; border: 2px solid #ffd66e; background: rgba(10, 14, 22, .85); border-radius: 14px; white-space: nowrap; } #cta small { display: block; font-size: 13px; font-weight: 400; color: #c9d6e6; margin-top: 2px; }
  #banner { position: absolute; top: 34%; left: 0; right: 0; text-align: center; font-size: 34px; font-weight: 900; letter-spacing: 4px; text-shadow: 0 0 18px rgba(0, 0, 0, .8), 0 3px 6px #000; }
  #hint { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); padding: 7px 16px; font-size: 13px; white-space: nowrap; }
  #prog { position: absolute; left: 50%; bottom: 62px; transform: translateX(-50%); width: 240px; padding: 8px 12px; font-size: 13px; text-align: center; display: none; } #prog .bar { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .15); margin-top: 6px; overflow: hidden; } #prog .bar i { display: block; height: 100%; background: #ffd66e; }
  #touch { position: absolute; right: 16px; bottom: 16px; display: none; gap: 12px; pointer-events: auto; } #touch button { width: 76px; height: 76px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .3); background: rgba(10, 14, 22, .6); color: #fff; font: inherit; font-weight: 800; }
  #screen { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box; background: radial-gradient(ellipse at center, rgba(4, 8, 14, .35), rgba(4, 8, 14, .88)); }
  #screen h1 { font-weight: 900; font-size: clamp(44px, 9vw, 84px); letter-spacing: 12px; margin: 0 0 4px 12px; text-shadow: 0 0 34px rgba(255, 200, 80, .5), 0 4px 10px #000; }
  #screen .sub { font-size: 15px; color: rgba(230, 238, 248, .9); margin-bottom: 14px; line-height: 1.8; }
  #screen .help { font-size: 13px; line-height: 2; color: rgba(215, 226, 240, .9); } #screen .help b { color: #ffd66e; }
  #screen table { margin: 12px auto 0; border-collapse: collapse; font-size: 14px; } #screen td { padding: 4px 14px; text-align: left; } #screen td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  #screen .go { margin-top: 22px; padding: 13px 46px; font-size: 19px; font-weight: 800; letter-spacing: 6px; cursor: pointer; border-radius: 14px; color: #2a1d02; background: #ffd66e; border: 0; box-shadow: 0 5px 0 #a8701a, 0 10px 18px rgba(0, 0, 0, .5); font-family: inherit; }
  #home { position: absolute; left: 12px; top: 12px; z-index: 30; display: flex; align-items: center; height: 44px; padding: 0 16px; border-radius: 12px; background: rgba(10, 14, 22, .8); border: 1px solid rgba(255, 255, 255, .25); color: #fff; font-size: 14px; text-decoration: none; }
  #screen[style*="display: none"] ~ #home { display: none; }
  @media (max-width: 720px) { #mini { width: 120px; height: 120px; } #topbar { top: auto; bottom: 110px; font-size: 12px; gap: 10px; padding: 6px 10px; } #topbar b { font-size: 14px; } #phone { top: 8px; right: 8px; width: 56vw; padding: 8px; } .ord { font-size: 12px; } #hint { display: none; } #touch { display: flex; } #toasts { top: 215px; } #nav { top: 148px; } #cta { top: 56%; font-size: 15px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "../vendor/three/build/three.module.js",
  "three/addons/": "../vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage">
  <div id="hud">
    <div id="mini" class="panel"><canvas id="map" width="360" height="360"></canvas></div>
    <div id="topbar" class="panel"><span><b id="clock">10:30</b> <span id="wx">晴</span></span><span>今日 <b id="money">¥0</b></span><span>服务分 <b id="rating">90</b></span><span>完成 <b id="done">0</b> 单</span></div>
    <div id="phone" class="panel"><h4>回声外卖 · 骑手端 <span id="lvl"></span></h4><div id="orders"></div>
      <div id="offer"><div id="oText"></div><div class="bar"><i id="oBar"></i></div><div class="row"><button id="oNo">拒单 N</button><button id="oYes">接单 Y</button></div></div></div>
    <div id="nav" class="panel"><span id="navA"><svg viewBox="0 0 24 24" fill="#241703"><path d="M12 2l8 18-8-4.500L4 20z"/></svg></span><span><b id="navT"></b><small id="navS"></small></span></div>
    <div id="pin"></div>
    <div id="cta" class="panel"></div>
    <div id="toasts"></div>
    <div id="banner"></div>
    <div id="prog" class="panel"><span id="progT"></span><div class="bar"><i id="progB"></i></div></div>
    <div id="speed" class="panel"><b id="kmh">0</b> km/h<i id="batt">电量 100%</i></div>
    <div id="hint" class="panel">W 加速　S 刹车　A D 转向　Y 接单　N 拒单　Tab 切换目标　M 静音</div>
    <div id="touch"><button id="tBrake">刹车</button><button id="tGo">加速</button></div>
  </div>
  <div id="screen"></div>
  <a id="home" href="../">‹ 游戏厅</a>
</div>
<script type="module">import("./game.js?t=" + Date.now());</script>
</body>
</html>
